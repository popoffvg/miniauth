# Local development only. The credentials are not secrets.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: miniauth
      POSTGRES_PASSWORD: miniauth
      POSTGRES_DB: miniauth
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "miniauth"]
      interval: 2s
      timeout: 2s
      retries: 15

  miniauth:
    build: .
    environment:
      MINIAUTH_LISTEN: 0.0.0.0:8080
      MINIAUTH_DATABASE_URL: postgres://miniauth:miniauth@postgres:5432/miniauth?sslmode=disable
      # SHA-256 of the local token dev-admin-token. The token is not a secret here.
      MINIAUTH_ADMIN_TOKEN_SHA256: 1734d503f6aa6a047c36d113cbad769f719c93784b469b771c4c3e7c63adbefd
      MINIAUTH_PUBLIC_URL: http://127.0.0.1:8088
    depends_on:
      postgres:
        condition: service_healthy

  whoami:
    image: traefik/whoami:v1.10.3

  traefik:
    image: traefik:v3.5.0
    command:
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --entrypoints.web.address=:80
      - --log.level=INFO
    ports:
      - "127.0.0.1:8088:80"
    volumes:
      - ./compose/traefik.yml:/etc/traefik/dynamic.yml:ro
    depends_on:
      - miniauth
      - whoami

volumes:
  postgres:
