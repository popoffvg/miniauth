version: "3"

# A GOROOT from the shell points at another Go and breaks the toolchain switch in go.mod.
env:
  GOROOT: ""

vars:
  TOOL: go tool -modfile=tools/go.mod
  COVER_DIR: coverage

tasks:
  setup:
    desc: Install the pinned tools and the pre-push hook
    cmds:
      - task: tools
      - task: hooks

  tools:
    desc: Build every tool pinned in tools/go.mod
    dir: tools
    cmds:
      - go build $(go list tool)

  hooks:
    desc: Install a git pre-push hook that runs `task pre-push`
    cmds:
      - |
        hook="$(git rev-parse --git-dir)/hooks/pre-push"
        printf '#!/bin/sh\nPATH="$(mise where go)/bin:$(mise where task)/bin:$PATH" exec task pre-push\n' > "$hook"
        chmod +x "$hook"
        echo "installed $hook"

  pre-push:
    desc: The checks the pre-push hook runs
    cmds:
      - task: lint
      - task: test

  lint:
    desc: golangci-lint (includes govet and gosec)
    cmds:
      - "{{.TOOL}} golangci-lint run ./..."

  fmt:
    desc: Format with gofumpt and goimports
    cmds:
      - "{{.TOOL}} golangci-lint fmt ./..."

  vet:
    desc: go vet
    cmds:
      - go vet ./...

  sec:
    desc: gosec with its own report
    cmds:
      - "{{.TOOL}} gosec -quiet ./..."

  generate:
    desc: Generate Go code from queries/*.sql with sqlc
    cmds:
      - "{{.TOOL}} sqlc generate"

  db:up:
    desc: Start the local PostgreSQL from compose.yaml and wait until it is healthy
    cmds:
      - docker compose up -d --wait postgres

  test:integration:
    desc: Tests against the local PostgreSQL
    deps: [db:up]
    env:
      MINIAUTH_TEST_DATABASE_URL: postgres://miniauth:miniauth@127.0.0.1:5432/miniauth?sslmode=disable
    cmds:
      - go test -race -count=1 ./...

  test:
    desc: Tests with the race detector
    cmds:
      - go test -race -count=1 ./...

  cover:
    desc: Coverage report with gocov; HTML in coverage/index.html
    cmds:
      - mkdir -p {{.COVER_DIR}}
      - go test -race -count=1 -coverprofile={{.COVER_DIR}}/cover.out -covermode=atomic ./...
      - "{{.TOOL}} gocov convert {{.COVER_DIR}}/cover.out > {{.COVER_DIR}}/cover.json"
      - "{{.TOOL}} gocov report {{.COVER_DIR}}/cover.json"
      - "{{.TOOL}} gocov-html {{.COVER_DIR}}/cover.json > {{.COVER_DIR}}/index.html"

  review:
    desc: CodeRabbit review of the uncommitted change (needs the coderabbit CLI and a login)
    preconditions:
      - sh: command -v coderabbit
        msg: "install the CodeRabbit CLI: curl -fsSL https://cli.coderabbit.ai/install.sh | sh"
    cmds:
      - coderabbit review --plain

  check:
    desc: Everything CI runs
    cmds:
      - task: lint
      - task: vet
      - task: sec
      - task: cover
