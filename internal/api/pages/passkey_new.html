{{template "head" "Add a passkey"}}
<h1>Add a passkey</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
<p>Signed in as {{.Login}}. The passkey signs you in without a password.</p>
<p class="message" role="alert" data-passkey-message hidden></p>
<form data-passkey-add="/passkeys">
<label for="name">Name</label>
<input id="name" name="name" maxlength="64" required autofocus placeholder="Laptop">
<button type="submit">Add a passkey</button>
</form>
<p><a href="/sessions">Back to your devices</a></p>
<script src="/assets/passkey.js"></script>
{{template "foot"}}
