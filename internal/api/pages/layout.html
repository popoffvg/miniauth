{{define "head"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.}}</title>
<style>
body{font-family:system-ui,sans-serif;background:#f4f4f5;color:#18181b;margin:0;padding:16px}
main{max-width:360px;margin:10vh auto;background:#fff;border-radius:8px;padding:24px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
h1{font-size:1.4rem;margin:0 0 16px}
label{display:block;margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:8px;font-size:1rem;border:1px solid #a1a1aa;border-radius:4px}
button{margin-top:16px;width:100%;padding:10px;font-size:1rem;border:0;border-radius:4px;background:#2563eb;color:#fff}
.message{background:#fef2f2;color:#991b1b;padding:8px;border-radius:4px}
@media (prefers-color-scheme:dark){body{background:#18181b;color:#f4f4f5}main{background:#27272a}input{background:#18181b;color:#f4f4f5}}
</style>
</head>
<body>
<main>
{{end}}
{{define "foot"}}</main>
</body>
</html>
{{end}}
