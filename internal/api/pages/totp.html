{{template "head" "Two-step login"}}
<h1>Enter the code</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
<form method="post" action="/login/totp">
<label for="code">Code from the authenticator app</label>
<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="16" required autofocus>
<button type="submit">Continue</button>
</form>
{{range .Links}}<p><a href="{{.Path}}">{{.Label}}</a></p>
{{end}}{{template "foot"}}
