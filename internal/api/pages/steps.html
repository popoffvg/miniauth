{{template "head" "Choose a sign-in method"}}
<h1>Choose a sign-in method</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
<ul>
{{range .Steps}}<li><a href="{{.Path}}">{{.Label}}</a></li>
{{end}}</ul>
{{range .Buttons}}<form method="post" action="{{.Path}}"><button type="submit">{{.Label}}</button></form>
{{end}}{{template "foot"}}
