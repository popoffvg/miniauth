{{template "head" "Sign in"}}
<h1>Sign in</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
<form method="post" action="/login">
<label for="login">Login</label>
<input id="login" name="login" autocomplete="username" required autofocus>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button>
</form>
{{range .Buttons}}<form method="post" action="{{.Path}}"><button type="submit">{{.Label}}</button></form>
{{end}}{{if .Recovery}}<p><a href="/recover">Forgot password?</a></p>{{end}}
{{template "foot"}}
