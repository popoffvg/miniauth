{{template "head" "Recovery code"}}
<h1>Enter a recovery code</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
<p>Each recovery code works one time.</p>
<form method="post" action="/login/recovery-code">
<label for="code">Recovery code</label>
<input id="code" name="code" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="32" required autofocus>
<button type="submit">Continue</button>
</form>
{{range .Links}}<p><a href="{{.Path}}">{{.Label}}</a></p>
{{end}}{{template "foot"}}
