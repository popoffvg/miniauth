{{template "head" "Turn on two-step login"}}
<h1>Turn on two-step login</h1>
{{with .Message}}<p class="message" role="alert">{{.}}</p>{{end}}
{{with .Enrollment}}<p>Scan the QR code with your authenticator app, or type the key.</p>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {{.QR.Size}} {{.QR.Size}}" width="240" height="240" role="img" aria-label="QR code with the key" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="{{.QR.Path}}"/></svg>
<p>Key: <code id="totp-secret">{{.Secret.Reveal}}</code></p>
{{end}}<form method="post" action="/sessions/totp/confirm">
<label for="code">Code from the app</label>
<input id="code" name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="16" required autofocus>
<button type="submit">Turn on</button>
</form>
{{template "foot"}}
