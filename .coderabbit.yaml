# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**/*.go"
      instructions: |
        This is an identity server. Read AGENTS.md first and check the change against it.
        Flag any secret (password, session id, token, flow cookie) that reaches a log, an error, a URL, or a column in clear text.
        Flag a secret comparison that is not constant time.
        Flag a domain concept carried by a bare string, []byte, or uuid.UUID instead of its own type.
        Flag a DTO (HTTP body, sqlc row) used inside a domain package.
    - path: "migrations/**"
      instructions: Flag an edit to a migration that already exists on main. A schema change is a new file.
    - path: "docs/adr/**"
      instructions: An ADR records why, not how. Flag file, function, and key names in it.
  tools:
    golangci-lint:
      enabled: true
    gitleaks:
      enabled: true
    actionlint:
      enabled: true
chat:
  auto_reply: true
