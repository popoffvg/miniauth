    get:
      description: 'Checks the Google reply: state, PKCE verifier, ID token issuer,
        audience, expiry, and nonce. Only the sub claim links the account. A linked
        account completes the flow: it sets the session cookie and redirects to the
        return URL. An unknown account starts no session and creates no user: it is
        kept 15 minutes as a pending link bound to the browser by the cookie __Host-id_pending_link,
