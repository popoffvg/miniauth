openapi: 3.0.3
info:
  title: miniauth
  version: 0.0.0
paths:
  /:
    get:
      description: The default page after a login. It shows the login of the session.
        With no session it redirects to the login page.
      operationId: home
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
  /access:
    get:
      description: Lists the resources and their grants, with the forms to change
        them. Only a member of the group admin opens it; any other user is 403. With
        no session it redirects to the login page, which returns here.
      operationId: accessPage
      parameters:
      - description: The result of the last change. The page shows a fixed message
          for a known value and ignores any other value.
        in: query
        name: done
        schema:
          description: The result of the last change. The page shows a fixed message
            for a known value and ignores any other value.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants:
    post:
      description: 'Gives one user or one group a resource and redirects to GET /access?done=granted.
        Only a member of the group admin can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: grantForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessGrantForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants/{id}/revoke:
    post:
      description: 'Revokes a grant and redirects to GET /access?done=revoked. The
        next /auth/check does not count it. Only a member of the group admin can send
        it; any other user is 403. Origin MUST be the public origin, else 403. A login
        older than 10 minutes starts a step-up instead: the page asks for the password
        of the session user and returns to GET /access. A refused change shows the
        page with a message and 400, 404, or 409.'
      operationId: revokeForm
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources:
    post:
      description: 'Adds a resource through the access service and redirects to GET
        /access?done=resource-added. Only a member of the group admin can send it;
        any other user is 403. Origin MUST be the public origin, else 403. A login
        older than 10 minutes starts a step-up instead: the page asks for the password
        of the session user and returns to GET /access. A refused change shows the
        page with a message and 400, 404, or 409.'
      operationId: addResourceForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessResourceForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources/{name}/delete:
    post:
      description: 'Deletes a resource and its grants and redirects to GET /access?done=resource-deleted.
        Only a member of the group admin can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: deleteResourceForm
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /api/v1/grants:
    get:
      description: Lists the grants, expired ones too, in resource name order. Each
        grant names its resource, its user or group, its expiry, and its creation
        time. user selects the grants to that user, not the grants to the user's groups.
        resource selects the grants of that resource. An unknown user or resource
        in the query is 404.
      operationId: listGrants
      parameters:
      - in: query
        name: user
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Gives one user or one group one resource. The body names exactly
        one of user (a login) and group. expires_at is RFC 3339 and MUST be in the
        future; with no expires_at the grant does not expire. An unknown user or resource
        is 404. A grant that already exists is 409.
      operationId: createGrant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateGrantRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/grants/{id}:
    delete:
      description: Revokes the grant. The next /auth/check does not count it.
      operationId: revokeGrant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/invites:
    post:
      description: 'Creates an invite for one resource. The reply holds the one-time
        link {public URL}/invite/{token}, shown once: only the SHA-256 of the token
        is stored. The link expires after 7 days. An unknown resource is 404. Without
        MINIAUTH_PUBLIC_URL it is 503.'
      operationId: createInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateInviteRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInviteBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources:
    get:
      description: Lists every resource in name order.
      operationId: listResources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Creates a resource that /auth/check protects. url MUST be an absolute
        http or https URL with no query. Only the host and the path are stored, and
        a reply url is the host and the path with no scheme. A name, or a host and
        path, that is already stored is 409.
      operationId: createResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateResourceRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources/{name}:
    delete:
      description: Deletes the resource and its grants.
      operationId: deleteResource
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/tokens/import:
    post:
      description: 'Stores the SHA-256 of a token made outside miniauth, so a client
        keeps its token. The token does not expire. 201 stores the token. 200 means
        the user already has the token: nothing changes. 409 means another user has
        the token. 404 means the login is not known.'
      operationId: importToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiImportTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /api/v1/users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateUserRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreatedUser'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /assets/passkey.js:
    get:
      description: The one script of the service. It runs the WebAuthn ceremonies
        of the login page and of the page that adds a passkey.
      operationId: passkeyScript
      responses:
        "200":
          content:
            text/javascript:
              schema:
                type: string
          description: OK
  /auth/check:
    get:
      description: 'Traefik forwardAuth. A valid session or a valid Authorization:
        Bearer idp_ token answers 200 and sets X-Auth-User, X-Auth-Email, X-Auth-Groups,
        and X-Auth-Method. A browser with no session is redirected to the login page.
        Any other request with no session is 401. An invalid, revoked, or expired
        token, or a token of a disabled user, is 401 with error="invalid_token". A
        URL under no scope of the token is 403. A user outside group is 403. The URL
        in X-Forwarded-Proto, X-Forwarded-Host, and X-Forwarded-Uri needs a resource
        and an active grant for the user or one of the user''s groups, for a session
        and for a token; else 403. The scope query does not limit a session.'
      operationId: forwardAuth
      parameters:
      - in: query
        name: scope
        schema:
          type: string
      - in: query
        name: group
        schema:
          type: string
      responses:
        "200":
          description: OK
        "302":
          description: Found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /healthz:
    get:
      operationId: getHealth
      responses:
        "204":
          description: No Content
  /invite/{token}:
    get:
      description: Shows the account form of an open invite. An unknown, used, or
        expired token is 410 with one page for the three cases. The request log shows
        the route pattern, not the token.
      operationId: invitePage
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "410":
          content:
            text/html:
              schema:
                type: string
          description: Gone
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /invite/accept:
    post:
      description: Accepts the invite in the form. Origin MUST be the public origin,
        else 403. In one transaction it marks the invite used, creates the user with
        a password identity, and grants the resource. Then it starts a session and
        redirects to https, the host, and the path prefix of the resource. A taken
        login shows the form again with 409, and the invite stays unused. An unknown,
        used, or expired token is 410.
      operationId: acceptInvite
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiInviteFormRequest'
      responses:
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "410":
          content:
            text/html:
              schema:
                type: string
          description: Gone
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /link:
    get:
      description: Names the Google or Telegram account of the pending link cookie
        and asks the session user to link it or not. A password login in a browser
        with a pending link redirects here; it never links by itself. With no live
        pending link, or a session without a password, it redirects with 302 to the
        return URL. With no session it redirects to the login page.
      operationId: linkPage
      parameters:
      - description: The page to open after the choice. An https URL under the cookie
          domain. Any other value opens the default page.
        in: query
        name: return
        schema:
          description: The page to open after the choice. An https URL under the cookie
            domain. Any other value opens the default page.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
        "303":
          description: See Other
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: Links (action=link) or deletes (action=skip) the pending link of
        this browser, then redirects to the return URL. Origin MUST be the public
        origin, else 403. An account linked to another user is 409. A store error
        is 500 and keeps the pending link cookie, so the form can be sent again.
      operationId: confirmLink
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiLinkForm'
      responses:
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /login:
    get:
      description: Starts a login flow and shows the login form. The flow id and secret
        go to the HttpOnly cookie __Host-id_login_flow.
      operationId: loginPage
      parameters:
      - description: The page to open after the login. An https URL under the cookie
          domain. Any other value opens the default page.
        in: query
        name: return
        schema:
          description: The page to open after the login. An https URL under the cookie
            domain. Any other value opens the default page.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: Checks the password for the flow in the login flow cookie. Origin
        MUST be the public origin, else 403. A complete flow sets the session cookie
        and redirects to the return URL. A wrong login or password shows the form
        again with 200. A backoff is 429. A step-up flow reads only the password,
        checks it for the user of the flow, renews the auth time of the session, and
        redirects to the return URL.
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiLoginFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
