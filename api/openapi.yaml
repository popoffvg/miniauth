openapi: 3.0.3
info:
  title: miniauth
  version: 0.0.0
paths:
  /:
    get:
      description: 'The overview page, the default page after a login: the login,
        the groups, the two-step login state, and the counts of active tokens, devices,
        and passkeys. With no session it redirects to the login page.'
      operationId: home
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
  /access:
    get:
      description: Lists the resources and their grants, with the forms to change
        them. Only a member of the group admins opens it; any other user is 403. With
        no session it redirects to the login page, which returns here.
      operationId: accessPage
      parameters:
      - description: Shows only the resources and the grants whose resource, URL,
          user, or group contains this text.
        in: query
        name: q
        schema:
          description: Shows only the resources and the grants whose resource, URL,
            user, or group contains this text.
          type: string
      - description: Shows only the grants in this state. Any other value shows every
          grant.
        in: query
        name: status
        schema:
          description: Shows only the grants in this state. Any other value shows
            every grant.
          enum:
          - active
          - expired
          type: string
      - description: The result of the last change. The page shows a fixed message
          for a known value and ignores any other value.
        in: query
        name: done
        schema:
          description: The result of the last change. The page shows a fixed message
            for a known value and ignores any other value.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants:
    post:
      description: 'Gives one user or one group a resource and redirects to GET /access?done=granted.
        Only a member of the group admins can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: grantForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessGrantForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants/{id}/revoke:
    post:
      description: 'Revokes a grant and redirects to GET /access?done=revoked. The
        next /auth/check does not count it. Only a member of the group admins can
        send it; any other user is 403. Origin MUST be the public origin, else 403.
        A login older than 10 minutes starts a step-up instead: the page asks for
        the password of the session user and returns to GET /access. A refused change
        shows the page with a message and 400, 404, or 409.'
      operationId: revokeForm
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources:
    post:
      description: 'Adds a resource through the access service and redirects to GET
        /access?done=resource-added. Only a member of the group admins can send it;
        any other user is 403. Origin MUST be the public origin, else 403. A login
        older than 10 minutes starts a step-up instead: the page asks for the password
        of the session user and returns to GET /access. A refused change shows the
        page with a message and 400, 404, or 409.'
      operationId: addResourceForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessResourceForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources/{name}/delete:
    post:
      description: 'Deletes a resource and its grants and redirects to GET /access?done=resource-deleted.
        Only a member of the group admins can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: deleteResourceForm
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /api/v1/grants:
    get:
      description: Lists the grants, expired ones too, in resource name order. Each
        grant names its resource, its user or group, its expiry, and its creation
        time. user selects the grants to that user, not the grants to the user's groups.
        resource selects the grants of that resource. An unknown user or resource
        in the query is 404.
      operationId: listGrants
      parameters:
      - in: query
        name: user
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Gives one user or one group one resource. The body names exactly
        one of user (a login) and group. expires_at is RFC 3339 and MUST be in the
        future; with no expires_at the grant does not expire. An unknown user, group,
        or resource is 404. A grant that already exists is 409.
      operationId: createGrant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateGrantRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/grants/{id}:
    delete:
      description: Revokes the grant. The next /auth/check does not count it. A grant
        from MINIAUTH_RESOURCES_FILE is 409.
      operationId: revokeGrant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/groups:
    get:
      description: Lists every group in name order, with its member count and its
        resources. A group reaches a resource through a group grant.
      operationId: listGroups
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGroupListBody'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Creates an empty group. A name that is stored is 409.
      operationId: createGroup
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateGroupRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGroupBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/groups/{group}:
    delete:
      description: Deletes the group, its memberships, and its grants. The built-in
        groups admins and users are 409. A group that MINIAUTH_RESOURCES_FILE names
        is 409.
      operationId: deleteGroup
      parameters:
      - in: path
        name: group
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/groups/{group}/members/{login}:
    delete:
      description: Removes the user from the group. A user who is not in the group
        is 404.
      operationId: removeGroupMember
      parameters:
      - in: path
        name: group
        required: true
        schema:
          type: string
      - in: path
        name: login
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    put:
      description: 'Adds the user to the group. A member stays a member: the request
        is idempotent. An unknown user or group is 404.'
      operationId: addGroupMember
      parameters:
      - in: path
        name: group
        required: true
        schema:
          type: string
      - in: path
        name: login
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/groups/{group}/resources/{name}:
    delete:
      description: Revokes the grant of the resource to the group. A group without
        the resource is 404. A grant from MINIAUTH_RESOURCES_FILE is 409.
      operationId: removeGroupResource
      parameters:
      - in: path
        name: group
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    put:
      description: 'Gives the group the resource: a group grant with no expiry. A
        group with an active grant keeps it: the request is idempotent. An expired
        grant is replaced by one with no expiry. An unknown group or resource is 404.'
      operationId: addGroupResource
      parameters:
      - in: path
        name: group
        required: true
        schema:
          type: string
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/invites:
    post:
      description: 'Creates an invite to one group; with no group it is users. The
        reply holds the one-time link {public URL}/invite/{token}, shown once: only
        the SHA-256 of the token is stored. The link expires after 7 days. An unknown
        group is 404. Without MINIAUTH_PUBLIC_URL it is 503.'
      operationId: createInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateInviteRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiInviteBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources:
    get:
      description: Lists every resource in name order.
      operationId: listResources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Creates a resource that /auth/check protects. url MUST be an absolute
        http or https URL with no query. Only the host and the path are stored, and
        a reply url is the host and the path with no scheme. A name, or a host and
        path, that is already stored is 409.
      operationId: createResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateResourceRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources/{name}:
    delete:
      description: Deletes the resource and its grants. A resource from MINIAUTH_RESOURCES_FILE
        is 409.
      operationId: deleteResource
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/tokens/import:
    post:
      description: 'Stores the SHA-256 of a token made outside miniauth, so a client
        keeps its token. The token does not expire. 201 stores the token. 200 means
        the user already has the token: nothing changes. 409 means another user has
        the token. 404 means the login is not known.'
      operationId: importToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiImportTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
