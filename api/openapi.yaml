  /login/telegram/callback:
    get:
      description: 'The data-auth-url of the Telegram Login Widget. It needs the login
        flow cookie of an open flow, and flow_nonce MUST be the nonce of that flow,
        so data sent to another browser is 400. The hash MUST be the HMAC-SHA256 of
        the other fields, sorted by key and joined as key=value lines, keyed with
        the SHA-256 of the bot token. Data older than one day, more than a minute
        in the future, or used before is 400. Only the id field links the account.
        A linked account completes the flow: it sets the session cookie and redirects
        to the return URL. An unknown account starts no session and creates no user:
        it is kept 15 minutes as a pending link bound to the browser by the cookie
        __Host-id_pending_link, and the page asks for a password login, which then
        links it.'
      operationId: telegramCallback
      parameters:
      - description: The nonce of the login flow in the data-auth-url. It MUST match
          the flow cookie.
        in: query
        name: flow_nonce
        required: true
        schema:
          description: The nonce of the login flow in the data-auth-url. It MUST match
            the flow cookie.
          type: string
      - description: The Telegram user id.
        in: query
        name: id
        required: true
        schema:
          description: The Telegram user id.
          type: string
      - in: query
        name: first_name
        schema:
          type: string
      - in: query
        name: last_name
        schema:
          type: string
      - in: query
        name: username
        schema:
          type: string
      - in: query
        name: photo_url
        schema:
          type: string
      - description: Unix seconds when Telegram signed the data.
        in: query
        name: auth_date
        required: true
        schema:
          description: Unix seconds when Telegram signed the data.
          type: string
      - description: Hex HMAC-SHA256 of the other fields, keyed with the SHA-256 of
          the bot token.
        in: query
        name: hash
        required: true
        schema:
          description: Hex HMAC-SHA256 of the other fields, keyed with the SHA-256
            of the bot token.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
