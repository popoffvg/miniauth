openapi: 3.0.3
info:
  title: miniauth
  version: 0.0.0
paths:
  /:
    get:
      description: The default page after a login. It shows the login of the session.
        With no session it redirects to the login page.
      operationId: home
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
  /access:
    get:
      description: Lists the resources and their grants, with the forms to change
        them. Only a member of the group admin opens it; any other user is 403. With
        no session it redirects to the login page, which returns here.
      operationId: accessPage
      parameters:
      - description: The result of the last change. The page shows a fixed message
          for a known value and ignores any other value.
        in: query
        name: done
        schema:
          description: The result of the last change. The page shows a fixed message
            for a known value and ignores any other value.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants:
    post:
      description: 'Gives one user or one group a resource and redirects to GET /access?done=granted.
        Only a member of the group admin can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: grantForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessGrantForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/grants/{id}/revoke:
    post:
      description: 'Revokes a grant and redirects to GET /access?done=revoked. The
        next /auth/check does not count it. Only a member of the group admin can send
        it; any other user is 403. Origin MUST be the public origin, else 403. A login
        older than 10 minutes starts a step-up instead: the page asks for the password
        of the session user and returns to GET /access. A refused change shows the
        page with a message and 400, 404, or 409.'
      operationId: revokeForm
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources:
    post:
      description: 'Adds a resource through the access service and redirects to GET
        /access?done=resource-added. Only a member of the group admin can send it;
        any other user is 403. Origin MUST be the public origin, else 403. A login
        older than 10 minutes starts a step-up instead: the page asks for the password
        of the session user and returns to GET /access. A refused change shows the
        page with a message and 400, 404, or 409.'
      operationId: addResourceForm
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiAccessResourceForm'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /access/resources/{name}/delete:
    post:
      description: 'Deletes a resource and its grants and redirects to GET /access?done=resource-deleted.
        Only a member of the group admin can send it; any other user is 403. Origin
        MUST be the public origin, else 403. A login older than 10 minutes starts
        a step-up instead: the page asks for the password of the session user and
        returns to GET /access. A refused change shows the page with a message and
        400, 404, or 409.'
      operationId: deleteResourceForm
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "409":
          content:
            text/html:
              schema:
                type: string
          description: Conflict
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /api/v1/grants:
    get:
      description: Lists the grants, expired ones too, in resource name order. Each
        grant names its resource, its user or group, its expiry, and its creation
        time. user selects the grants to that user, not the grants to the user's groups.
        resource selects the grants of that resource. An unknown user or resource
        in the query is 404.
      operationId: listGrants
      parameters:
      - in: query
        name: user
        schema:
          type: string
      - in: query
        name: resource
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantList'
          description: OK
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Gives one user or one group one resource. The body names exactly
        one of user (a login) and group. expires_at is RFC 3339 and MUST be in the
        future; with no expires_at the grant does not expire. An unknown user or resource
        is 404. A grant that already exists is 409.
      operationId: createGrant
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateGrantRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiGrantBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/grants/{id}:
    delete:
      description: Revokes the grant. The next /auth/check does not count it.
      operationId: revokeGrant
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources:
    get:
      description: Lists every resource in name order.
      operationId: listResources
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceList'
          description: OK
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
    post:
      description: Creates a resource that /auth/check protects. url MUST be an absolute
        http or https URL with no query. Only the host and the path are stored, and
        a reply url is the host and the path with no scheme. A name, or a host and
        path, that is already stored is 409.
      operationId: createResource
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateResourceRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResourceBody'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/resources/{name}:
    delete:
      description: Deletes the resource and its grants.
      operationId: deleteResource
      parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "503":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Service Unavailable
      security:
      - bearerAuth: []
  /api/v1/tokens/import:
    post:
      description: 'Stores the SHA-256 of a token made outside miniauth, so a client
        keeps its token. The token does not expire. 201 stores the token. 200 means
        the user already has the token: nothing changes. 409 means another user has
        the token. 404 means the login is not known.'
      operationId: importToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiImportTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /api/v1/users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateUserRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreatedUser'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /auth/check:
    get:
      description: 'Traefik forwardAuth. A valid session or a valid Authorization:
        Bearer idp_ token answers 200 and sets X-Auth-User, X-Auth-Email, X-Auth-Groups,
        and X-Auth-Method. A browser with no session is redirected to the login page.
        Any other request with no session is 401. An invalid, revoked, or expired
        token, or a token of a disabled user, is 401 with error="invalid_token". A
        URL under no scope of the token is 403. A user outside group is 403. The URL
        in X-Forwarded-Proto, X-Forwarded-Host, and X-Forwarded-Uri needs a resource
        and an active grant for the user or one of the user''s groups, for a session
        and for a token; else 403. The scope query does not limit a session.'
      operationId: forwardAuth
      parameters:
      - in: query
        name: scope
        schema:
          type: string
      - in: query
        name: group
        schema:
          type: string
      responses:
        "200":
          description: OK
        "302":
          description: Found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /healthz:
    get:
      operationId: getHealth
      responses:
        "204":
          description: No Content
  /login:
    get:
      description: Starts a login flow and shows the login form. The flow id and secret
        go to the HttpOnly cookie __Host-id_login_flow.
      operationId: loginPage
      parameters:
      - description: The page to open after the login. An https URL under the cookie
          domain. Any other value opens the default page.
        in: query
        name: return
        schema:
          description: The page to open after the login. An https URL under the cookie
            domain. Any other value opens the default page.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: Checks the password for the flow in the login flow cookie. Origin
        MUST be the public origin, else 403. A complete flow sets the session cookie
        and redirects to the return URL. A wrong login or password shows the form
        again with 200. A backoff is 429. A step-up flow reads only the password,
        checks it for the user of the flow, renews the auth time of the session, and
        redirects to the return URL.
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiLoginFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "429":
          content:
            text/html:
              schema:
                type: string
          description: Too Many Requests
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
  /logout/everywhere:
    post:
      operationId: logoutEverywhere
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
  /readyz:
    get:
      operationId: getReady
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
  /recover:
    get:
      description: Asks for the email address of a user who forgot the password. 503
        when no mail sender is configured.
      operationId: recoverPage
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: Sends a one-time reset link to the login equal to the email, in
        the background. A known and an unknown address get the same 200 page. Origin
        MUST be the public origin, else 403. A backoff per address and per client
        IP is 429.
      operationId: recover
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiRecoverFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "429":
          content:
            text/html:
              schema:
                type: string
          description: Too Many Requests
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /recover/{token}:
    get:
      description: The link from the recovery mail. It shows the new password form
        with the token in a hidden field. Referrer-Policy is no-referrer. An unknown,
        used, or expired link is 400.
      operationId: resetPage
      parameters:
      - in: path
        name: token
        required: true
        schema:
          maxLength: 43
          minLength: 43
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /recover/reset:
    post:
      description: Sets the new password through the token in the form. Every session
        of the user is deleted. Personal access tokens stay valid. The link cannot
        be used again. Origin MUST be the public origin, else 403.
      operationId: resetPassword
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiResetFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /sessions:
    get:
      description: HTML page with the devices of the session user. A browser with
        no session is redirected to the login page. Any other request with no session
        is 401.
      operationId: listDevices
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
  /sessions/{device}/forget:
    post:
      description: Deletes a device of the session user and its session. Origin MUST
        be the public URL origin, else 403. Redirects to the sessions page.
      operationId: forgetDevice
      parameters:
      - in: path
        name: device
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "303":
          description: See Other
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
  /sessions/{device}/signout:
    post:
      description: Deletes the session of a device of the session user. The device
        stays. Origin MUST be the public URL origin, else 403. Redirects to the sessions
        page.
      operationId: signOutDevice
      parameters:
      - in: path
        name: device
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "303":
          description: See Other
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
  /tokens:
    get:
      description: Lists the personal access tokens of the session user, with the
        form to make one. With no session it redirects to the login page, which returns
        here.
      operationId: tokenPage
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: 'Makes a personal access token and shows it once, with Cache-Control:
        no-store. Origin MUST be the public origin, else 403. A login older than 10
        minutes starts a step-up instead: the page asks for the password of the session
        user and returns to GET /tokens.'
      operationId: createToken
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiTokenFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /tokens/{id}/revoke:
    post:
      description: Revokes one token of the session user and redirects to GET /tokens.
        Origin MUST be the public origin, else 403. A token of another user is 404.
      operationId: revokeToken
      parameters:
      - in: path
        name: id
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "303":
          description: See Other
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "404":
          content:
            text/html:
              schema:
                type: string
          description: Not Found
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
components:
  schemas:
    ApiCreateGrantRequest:
      properties:
        expires_at:
          format: date-time
          type: string
        group:
          type: string
        resource:
          type: string
        user:
          type: string
      required:
      - resource
      type: object
    ApiCreateResourceRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
          type: string
        url:
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    ApiCreateUserRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._@+-]{0,62}[A-Za-z0-9])?$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
    ApiCreatedUser:
      properties:
        id:
          format: uuid
          type: string
        login:
          type: string
      type: object
    ApiGrantBody:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        group:
          type: string
        id:
          format: uuid
          type: string
        resource:
          $ref: '#/components/schemas/ApiResourceBody'
        user:
          type: string
      type: object
    ApiGrantList:
      properties:
        grants:
          items:
            $ref: '#/components/schemas/ApiGrantBody'
          type: array
      required:
      - grants
      type: object
    ApiImportTokenRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
        scopes:
          items:
            type: string
          minItems: 1
          type: array
        token:
          format: password
          pattern: ^idp_[0-9A-Za-z]{43}$
          type: string
        user:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - user
      - name
      - scopes
      - token
      type: object
    ApiImportedToken:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    ApiProblemBody:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      type: object
    ApiResourceBody:
      properties:
        name:
          type: string
        url:
          type: string
      type: object
    ApiResourceList:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ApiResourceBody'
          type: array
      required:
      - resources
      type: object
    FormDataApiAccessGrantForm:
      properties:
        expires:
          description: An HTML date (the grant works until the end of that UTC day)
            or datetime-local in UTC. Empty never expires.
          type: string
        group:
          description: A group name. Exactly one of user and group.
          type: string
        resource:
          type: string
        user:
          description: A login. Exactly one of user and group.
          type: string
      required:
      - resource
      type: object
    FormDataApiAccessResourceForm:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
        url:
          description: An absolute http or https URL with no query.
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    FormDataApiLoginFormRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
    FormDataApiRecoverFormRequest:
      properties:
        email:
          format: email
          maxLength: 64
          minLength: 1
          type: string
      required:
      - email
      type: object
    FormDataApiResetFormRequest:
      properties:
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        token:
          maxLength: 43
          minLength: 43
          type: string
      required:
      - token
      - password
      type: object
    FormDataApiTokenFormRequest:
      properties:
        expires:
          description: The token works until the end of this UTC day. Empty never
            expires.
          format: date
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        scopes:
          description: One URL prefix per line. No line reaches every URL.
          type: string
      required:
      - name
      type: object
  securitySchemes:
    bearerAuth:
      description: Bootstrap admin token. MINIAUTH_ADMIN_TOKEN_SHA256 holds the hex
        SHA-256 of the token. The token is not in the config.
      scheme: bearer
      type: http
