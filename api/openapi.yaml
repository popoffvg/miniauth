        or used before is 400. Only the id field links the account. A linked account
        completes the flow: it sets the session cookie and redirects to the return
        URL. An unknown account starts no session and creates no user: it is kept
        15 minutes as a pending link bound to the browser by the cookie __Host-id_pending_link,
        and the page asks for a password login, which then links it.'
