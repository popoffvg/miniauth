openapi: 3.0.3
info:
  title: miniauth
  version: 0.0.0
paths:
  /:
    get:
      description: The default page after a login. It shows the login of the session.
        With no session it redirects to the login page.
      operationId: home
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
  /api/v1/tokens/import:
    post:
      description: 'Stores the SHA-256 of a token made outside miniauth, so a client
        keeps its token. The token does not expire. 201 stores the token. 200 means
        the user already has the token: nothing changes. 409 means another user has
        the token. 404 means the login is not known.'
      operationId: importToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiImportTokenRequest'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: OK
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiImportedToken'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /api/v1/users:
    post:
      operationId: createUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApiCreateUserRequest'
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiCreatedUser'
          description: Created
        "400":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Bad Request
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "409":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Conflict
        "413":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Request Entity Too Large
        "415":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unsupported Media Type
      security:
      - bearerAuth: []
  /auth/check:
    get:
      description: 'Traefik forwardAuth. A valid session or a valid Authorization:
        Bearer idp_ token answers 200 and sets X-Auth-User, X-Auth-Email, X-Auth-Groups,
        and X-Auth-Method. A browser with no session is redirected to the login page.
        Any other request with no session is 401. An invalid, revoked, or expired
        token, or a token of a disabled user, is 401 with error="invalid_token". A
        URL under no scope of the token is 403. A user outside group is 403. The URL
        in X-Forwarded-Proto, X-Forwarded-Host, and X-Forwarded-Uri needs a resource
        and an active grant for the user or one of the user''s groups, for a session
        and for a token; else 403. The scope query does not limit a session.'
      operationId: forwardAuth
      parameters:
      - in: query
        name: scope
        schema:
          type: string
      - in: query
        name: group
        schema:
          type: string
      responses:
        "200":
          description: OK
        "302":
          description: Found
        "401":
          description: Unauthorized
        "403":
          description: Forbidden
  /healthz:
    get:
      operationId: getHealth
      responses:
        "204":
          description: No Content
  /login:
    get:
      description: Starts a login flow and shows the login form. The flow id and secret
        go to the HttpOnly cookie __Host-id_login_flow.
      operationId: loginPage
      parameters:
      - description: The page to open after the login. An https URL under the cookie
          domain. Any other value opens the default page.
        in: query
        name: return
        schema:
          description: The page to open after the login. An https URL under the cookie
            domain. Any other value opens the default page.
          type: string
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
    post:
      description: Checks the password for the flow in the login flow cookie. Origin
        MUST be the public origin, else 403. A complete flow sets the session cookie
        and redirects to the return URL. A wrong login or password shows the form
        again with 200. A backoff is 429.
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/FormDataApiLoginFormRequest'
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "303":
          description: See Other
        "400":
          content:
            text/html:
              schema:
                type: string
          description: Bad Request
        "403":
          content:
            text/html:
              schema:
                type: string
          description: Forbidden
        "429":
          content:
            text/html:
              schema:
                type: string
          description: Too Many Requests
        "500":
          content:
            text/html:
              schema:
                type: string
          description: Internal Server Error
        "503":
          content:
            text/html:
              schema:
                type: string
          description: Service Unavailable
  /logout:
    post:
      operationId: logout
      responses:
        "204":
          description: No Content
  /logout/everywhere:
    post:
      operationId: logoutEverywhere
      responses:
        "204":
          description: No Content
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
  /openapi.yaml:
    get:
      operationId: getOpenAPI
      responses:
        "200":
          content:
            application/json:
              schema:
                type: string
          description: OK
  /readyz:
    get:
      operationId: getReady
      responses:
        "200":
          description: OK
        "503":
          description: Service Unavailable
  /sessions:
    get:
      description: HTML page with the devices of the session user. A browser with
        no session is redirected to the login page. Any other request with no session
        is 401.
      operationId: listDevices
      responses:
        "200":
          content:
            text/html:
              schema:
                type: string
          description: OK
        "302":
          description: Found
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
  /sessions/{device}/forget:
    post:
      description: Deletes a device of the session user and its session. Origin MUST
        be the public URL origin, else 403. Redirects to the sessions page.
      operationId: forgetDevice
      parameters:
      - in: path
        name: device
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "303":
          description: See Other
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
  /sessions/{device}/signout:
    post:
      description: Deletes the session of a device of the session user. The device
        stays. Origin MUST be the public URL origin, else 403. Redirects to the sessions
        page.
      operationId: signOutDevice
      parameters:
      - in: path
        name: device
        required: true
        schema:
          format: uuid
          type: string
      responses:
        "303":
          description: See Other
        "401":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiProblemBody'
          description: Not Found
components:
  schemas:
    ApiCreateUserRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._@+-]{0,62}[A-Za-z0-9])?$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
    ApiCreatedUser:
      properties:
        id:
          format: uuid
          type: string
        login:
          type: string
      type: object
    ApiImportTokenRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
        scopes:
          items:
            type: string
          minItems: 1
          type: array
        token:
          format: password
          pattern: ^idp_[0-9A-Za-z]{43}$
          type: string
        user:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - user
      - name
      - scopes
      - token
      type: object
    ApiImportedToken:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    ApiProblemBody:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      type: object
    FormDataApiLoginFormRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
  securitySchemes:
    bearerAuth:
      description: Bootstrap admin token. MINIAUTH_ADMIN_TOKEN_SHA256 holds the hex
        SHA-256 of the token. The token is not in the config.
      scheme: bearer
      type: http
