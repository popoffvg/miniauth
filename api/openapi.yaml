  /login/telegram/callback:
    get:
      description: 'The data-auth-url of the Telegram Login Widget. It needs the login
        flow cookie of an open flow. The hash MUST be the HMAC-SHA256 of the other
        fields, sorted by key and joined as key=value lines, keyed with the SHA-256
