components:
  schemas:
    ApiCreateGrantRequest:
      properties:
        expires_at:
          format: date-time
          type: string
        group:
          type: string
        resource:
          type: string
        user:
          type: string
      required:
      - resource
      type: object
    ApiCreateGroupRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
          type: string
      required:
      - name
      type: object
    ApiCreateInviteRequest:
      properties:
        group:
          type: string
      type: object
    ApiCreateResourceRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._-]{0,62}[A-Za-z0-9])?$
          type: string
        url:
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    ApiCreateUserRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          pattern: ^[A-Za-z0-9](?:[A-Za-z0-9._@+-]{0,62}[A-Za-z0-9])?$
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
    ApiCreatedUser:
      properties:
        id:
          format: uuid
          type: string
        login:
          type: string
      type: object
    ApiGrantBody:
      properties:
        created_at:
          format: date-time
          type: string
        expires_at:
          format: date-time
          type: string
        group:
          type: string
        id:
          format: uuid
          type: string
        managed:
          type: boolean
        resource:
          $ref: '#/components/schemas/ApiGrantResourceBody'
        user:
          type: string
      type: object
    ApiGrantList:
      properties:
        grants:
          items:
            $ref: '#/components/schemas/ApiGrantBody'
          type: array
      required:
      - grants
      type: object
    ApiGrantResourceBody:
      properties:
        name:
          type: string
        url:
          type: string
      type: object
    ApiGroupBody:
      properties:
        built_in:
          type: boolean
        created_at:
          format: date-time
          type: string
        members:
          type: integer
        name:
          type: string
        resources:
          items:
            $ref: '#/components/schemas/ApiGroupResourceBody'
          type: array
      required:
      - resources
      type: object
    ApiGroupListBody:
      properties:
        groups:
          items:
            $ref: '#/components/schemas/ApiGroupBody'
          type: array
      required:
      - groups
      type: object
    ApiGroupResourceBody:
      properties:
        managed:
          type: boolean
        name:
          type: string
      type: object
    ApiImportTokenRequest:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
        scopes:
          items:
            type: string
          minItems: 1
          type: array
        token:
          format: password
          pattern: ^idp_[0-9A-Za-z]{43}$
          type: string
        user:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - user
      - name
      - scopes
      - token
      type: object
    ApiImportedToken:
      properties:
        id:
          format: uuid
          type: string
        name:
          type: string
        prefix:
          type: string
        scopes:
          items:
            type: string
          type: array
      type: object
    ApiInviteBody:
      properties:
        expires_at:
          format: date-time
          type: string
        group:
          type: string
        link:
          format: uri
          type: string
      type: object
    ApiPasskeyAddRequest:
      properties:
        credential:
          $ref: '#/components/schemas/ApiPasskeyCredential'
        name:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - name
      - credential
      type: object
    ApiPasskeyCredential:
      properties:
        id:
          type: string
        rawId:
          type: string
        response:
          additionalProperties: {}
          nullable: true
          type: object
        type:
          enum:
          - public-key
          type: string
      type: object
    ApiPasskeyDone:
      properties:
        location:
          format: uri
          type: string
      type: object
    ApiPasskeyOptions:
      properties:
        publicKey:
          additionalProperties: {}
          description: PublicKeyCredentialRequestOptions or PublicKeyCredentialCreationOptions.
            Byte fields are base64url.
          nullable: true
          type: object
      type: object
    ApiProblemBody:
      properties:
        detail:
          type: string
        status:
          type: integer
        title:
          type: string
        type:
          type: string
      type: object
    ApiResourceBody:
      properties:
        managed:
          type: boolean
        name:
          type: string
        url:
          type: string
      type: object
    ApiResourceList:
      properties:
        resources:
          items:
            $ref: '#/components/schemas/ApiResourceBody'
          type: array
      required:
      - resources
      type: object
    ApiUserAccountBody:
      properties:
        created_at:
          format: date-time
          type: string
        devices:
          type: integer
        disabled:
          type: boolean
        disabled_at:
          format: date-time
          type: string
        groups:
          items:
            type: string
          type: array
        last_seen:
          format: date-time
          type: string
        login:
          type: string
      required:
      - groups
      type: object
    ApiUserListBody:
      properties:
        users:
          items:
            $ref: '#/components/schemas/ApiUserAccountBody'
          type: array
      required:
      - users
      type: object
    FormDataApiAccessGrantForm:
      properties:
        expires:
          description: An HTML date (the grant works until the end of that UTC day)
            or datetime-local in UTC. Empty never expires.
          type: string
        group:
          description: A group name. Exactly one of user and group.
          type: string
        resource:
          type: string
        user:
          description: A login. Exactly one of user and group.
          type: string
      required:
      - resource
      type: object
    FormDataApiAccessResourceForm:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
        url:
          description: An absolute http or https URL with no query.
          format: uri
          type: string
      required:
      - name
      - url
      type: object
    FormDataApiCodeFormRequest:
      properties:
        code:
          description: 6 digits from the authenticator app.
          maxLength: 16
          minLength: 6
          type: string
      required:
      - code
      type: object
    FormDataApiGroupForm:
      properties:
        name:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - name
      type: object
    FormDataApiGroupResourceForm:
      properties:
        resource:
          type: string
      required:
      - resource
      type: object
    FormDataApiInviteFormRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        token:
          type: string
      required:
      - token
      - login
      - password
      type: object
    FormDataApiLinkForm:
      properties:
        action:
          description: link makes the outside account an identity of the session user.
            skip deletes the pending link.
          enum:
          - link
          - skip
          type: string
        return:
          description: The page to open after the choice, as in GET /link.
          type: string
      required:
      - action
      type: object
    FormDataApiLoginFormRequest:
      properties:
        login:
          maxLength: 64
          minLength: 1
          type: string
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
      required:
      - login
      - password
      type: object
    FormDataApiRecoverFormRequest:
      properties:
        email:
          format: email
          maxLength: 64
          minLength: 1
          type: string
      required:
      - email
      type: object
    FormDataApiRecoveryFormRequest:
      properties:
        code:
          description: One recovery code. Case, spaces, and dashes are ignored.
          maxLength: 32
          minLength: 16
          type: string
      required:
      - code
      type: object
    FormDataApiResetFormRequest:
      properties:
        password:
          format: password
          maxLength: 1024
          minLength: 1
          type: string
        token:
          maxLength: 43
          minLength: 43
          type: string
      required:
      - token
      - password
      type: object
    FormDataApiTokenFormRequest:
      properties:
        expires:
          description: The token works until the end of this UTC day. Empty never
            expires.
          format: date
          type: string
        name:
          maxLength: 64
          minLength: 1
          type: string
        scopes:
          description: One URL prefix per line. No line reaches every URL.
          type: string
      required:
      - name
      type: object
    FormDataApiUserGroupForm:
      properties:
        group:
          maxLength: 64
          minLength: 1
          type: string
      required:
      - group
      type: object
    FormDataApiUserInviteForm:
      properties:
        group:
          description: 'The group of the new account. Empty: users.'
          type: string
      type: object
  securitySchemes:
    bearerAuth:
      description: Bootstrap admin token. MINIAUTH_ADMIN_TOKEN_SHA256 holds the hex
        SHA-256 of the token. The token is not in the config.
      scheme: bearer
      type: http
