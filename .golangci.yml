version: "2"

run:
  timeout: 5m

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - misspell
    - noctx
    - revive
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - wrapcheck
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gosec:
      excludes: []
    wrapcheck:
      ignore-package-globs:
        - github.com/popoffvg/miniauth/*
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - wrapcheck
          - gosec

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/popoffvg/miniauth
